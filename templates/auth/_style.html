{# Présentation commune des pages de connexion : une carte étroite, centrée. #}
<style>
    .auth-card { max-width: 420px; margin: 30px auto; display: grid; gap: 14px; }
    .auth-card h2 { margin: 0; font-size: 20px; text-align: center; }
    .auth-card label { margin-bottom: 4px; }
    .auth-card input { height: 38px; font-size: 16px; }
    .auth-msg { border-radius: 8px; padding: 10px 14px; font-size: 14px; }
    .auth-msg.erreur { background: #fee2e2; color: #991b1b; }
    .auth-msg.info { background: #e0f2fe; color: #075985; }
    .auth-msg.ok { background: #dcfce7; color: #166534; }
    .auth-liens { display: flex; justify-content: space-between; font-size: 13px; }
    .auth-liens a { color: var(--accent); text-decoration: none; }
</style>
