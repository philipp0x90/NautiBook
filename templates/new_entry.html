{% extends "base.html" %}

{% block title %}New Entry — NautiBook{% endblock %}

{% block content %}
<a href="/">← Back to Logbook</a>
<h1 style="margin-top:8px">New Logbook Entry</h1>

<form method="POST" action="/logbook/new" class="card" style="margin-top:12px;display:grid;gap:12px">
    <div class="grid">
        <div>
            <label>Latitude</label>
            <input type="number" step="any" name="position_lat" placeholder="43.7034">
        </div>
        <div>
            <label>Longitude</label>
            <input type="number" step="any" name="position_lon" placeholder="7.2663">
        </div>
    </div>

    <div class="grid">
        <div>
            <label>Speed (knots)</label>
            <input type="number" step="any" name="speed" placeholder="5.2">
        </div>
        <div>
            <label>Wind Speed (knots)</label>
            <input type="number" step="any" name="wind_speed" placeholder="12.5">
        </div>
    </div>

    <div>
        <label>Notes</label>
        <textarea name="notes" placeholder="Beautiful day sailing..."></textarea>
    </div>

    <div>
        <button type="submit" class="primary">Save Entry</button>
    </div>
</form>

{% endblock %}
