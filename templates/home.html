{% extends "base.html" %}

{% block title %}NautiBook{% endblock %}

{% block head %}
<style>
    .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 75vh;
        text-align: center;
        gap: 24px;
    }
    .splash-logo {
        font-size: 80px;
        line-height: 1;
        color: #1b5fa3;
        font-weight: 900;
        letter-spacing: -2px;
        user-select: none;
    }
    .splash-subtitle {
        font-size: 15px;
        color: var(--muted);
        letter-spacing: 3px;
        text-transform: uppercase;
    }
    .splash-nav {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 16px;
    }
    .splash-nav a {
        padding: 10px 28px;
        border-radius: 20px;
        background: #e8f4f9;
        color: #1b5fa3;
        font-weight: 600;
        text-decoration: none;
        font-size: 15px;
        transition: background 0.15s;
    }
    .splash-nav a:hover { background: #7dd3e8; color: #0f3a4a; }
</style>
{% endblock %}

{% block content %}
<div class="splash">
    <div>
        <div class="splash-logo">⚓</div>
        <div style="font-size:42px;font-weight:900;color:#1b5fa3;letter-spacing:6px;margin-top:8px">NAUTIBOOK</div>
    </div>
    <div class="splash-subtitle">Journal de bord numérique</div>
    <div class="splash-nav">
        <a href="/ship/info">Navire</a>
        <a href="/cruises/current">Croisières</a>
        <a href="/routes">Routes</a>
        <a href="/tools/weather">Outils</a>
        <a href="/gallery">Gallerie</a>
    </div>
</div>
{% endblock %}
