{% extends "base.html" %}
{% block title %}Nouvelle ligne — NautiBook{% endblock %}

{% block head %}
<style>
    /* Five thematic columns, each stacking its own fields. The columns share the
       parent's rows through subgrid, so a label that wraps in one column pushes
       every column's next field down with it and the rows stay aligned. Without
       subgrid the groups still stack, just each at its own rhythm. */
    .field-groups {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(5, auto);
        gap: 10px 20px;
    }
    .field-group {
        display: grid;
        grid-row: 1 / -1;
        grid-template-rows: subgrid;
        gap: 10px;
        align-content: start;
    }
    .field-group-title { text-align: center; font-weight: 700; font-size: 14px; }
    /* Narrower screens rewrap the groups, so the shared rows have to be undone. */
    @media (max-width: 900px) {
        .field-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; gap: 20px; }
        .field-group { grid-row: auto; grid-template-rows: none; }
    }
    @media (max-width: 560px) {
        .field-groups { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}

<h2 style="margin:24px 0 18px;font-size:18px;text-align:center">Ajouter une ligne au journal de bord</h2>

<form method="POST" action="/routes/{{ route.id }}/new-line" class="card" style="display:grid;gap:16px">

    <div class="field-groups">

        <div class="field-group">
            <div class="field-group-title">Vent</div>
            <div>
                <label>AWS (kn)</label>
                <input type="number" step="any" name="aws" value="{{ data.aws if data else '' }}">
            </div>
            <div>
                <label>TWS (kn)</label>
                <input type="number" step="any" name="tws">
            </div>
            <div>
                <label>AWA (°)</label>
                <input type="number" step="1" name="awa" value="{{ data.awa if data else '' }}">
            </div>
            <div>
                <label>TWA (°)</label>
                <input type="number" step="1" name="twa">
            </div>
        </div>

        <div class="field-group">
            <div class="field-group-title">Environnement</div>
            <div>
                <label>État de la mer</label>
                <select name="sea_state">
                    {% for opt in ['Calme','Belle','Peu Agitée','Agitée','Forte','Très forte','Grosse','Très grosse','Énorme'] %}
                    <option value="{{ opt }}">{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>P° Atmo. (hPa)</label>
                <input type="number" step="any" name="pressure" value="{{ data.pressure if data else '' }}">
            </div>
            <div>
                <label>T° eau (°C)</label>
                <input type="number" step="any" name="water_temp" value="{{ data.water_temp if data else '' }}">
            </div>
            <div>
                <label>Visibilité</label>
                <select name="visibility">
                    {% for opt in ['Bonne','Moyenne','Mauvaise','Très Mauvaise'] %}
                    <option value="{{ opt }}">{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="field-group">
            <div class="field-group-title">Course</div>
            <div>
                <label>Cap (°)</label>
                <input type="number" step="1" name="heading" value="{{ data.heading if data else '' }}">
            </div>
            <div>
                <label>COG (°)</label>
                <input type="number" step="1" name="cog" value="{{ data.cog if data else '' }}">
            </div>
            <div>
                <label>Trip (NM)</label>
                <input type="number" step="any" name="trip" value="{{ data.trip if data else '' }}">
            </div>
            <div>
                <label>Log (NM)</label>
                <input type="number" step="any" name="log" value="{{ data.log if data else '' }}">
            </div>
        </div>

        <div class="field-group">
            <div class="field-group-title">Navire</div>
            <div>
                <label>STW (kn)</label>
                <input type="number" step="any" name="stw" value="{{ data.stw if data else '' }}">
            </div>
            <div>
                <label>SOG (kn)</label>
                <input type="number" step="any" name="sog" value="{{ data.sog if data else '' }}">
            </div>
            <div>
                <label>Voiles</label>
                <select name="sails">
                    {% for opt in ['Moteur','GV + Génois','GV 1 Ris + Génois','GV 2 Ris + Génois','GV + Moteur','+ Appui Moteur','Génois seul','GV seule','GV + Trinq.','GV 1 Ris + Trinq.','GV 2 Ris + Trinq.','Trinq. seule','À sec'] %}
                    <option value="{{ opt }}">{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Allure</label>
                <select name="points_of_sail">
                    {% for opt in ['Près','Bon plein','Travers','Largue','Grand largue','Vent arrière','Cape','N/A','Vent debout'] %}
                    <option value="{{ opt }}">{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="field-group">
            <div class="field-group-title">Position</div>
            <div>
                <label>Latitude</label>
                <input type="number" step="any" name="position_lat" value="{{ data.lat if data else '' }}">
            </div>
            <div>
                <label>Longitude</label>
                <input type="number" step="any" name="position_lon" value="{{ data.long if data else '' }}">
            </div>
            <div>
                <label>Sonde (m)</label>
                <input type="number" step="0.1" name="depth" value="{{ '%.1f'|format(data.depth) if data and data.depth is not none else '' }}">
            </div>
            <div>
                <label>Position (visuelle)</label>
                <input type="text" name="visual_pos" placeholder="Bouée xyz, devant le cap...">
            </div>
        </div>

    </div>

    <div>
        <label>Notes / Journal</label>
        <textarea name="notes" rows="3" placeholder="Observations, événements..."></textarea>
    </div>

    <div style="display:flex;gap:10px">
        <button type="submit" class="primary">Enregistrer la ligne</button>
        <a href="/routes/{{ route.id }}" style="padding:9px 16px;color:var(--muted);text-decoration:none;font-size:14px">Annuler</a>
    </div>
</form>

{% endblock %}
