{% extends "base.html" %}

{% block title %}Nouvelle route — NautiBook{% endblock %}

{% block content %}
<div class="meta" style="margin-bottom:4px;font-size:18px;font-weight:600">{{ cruise.name }}</div>
<h1 style="margin-top:2px">Nouvelle route</h1>

<form method="POST" action="/routes/new" class="card" style="margin-top:12px;display:grid;gap:14px;max-width:520px">
    <input type="hidden" name="cruise_id" value="{{ cruise.id }}">
    <div class="grid">
        <div>
            <label>Départ de</label>
            <input type="text" name="departure_location" placeholder="Marseille">
        </div>
        <div>
            <label>Arrivée à</label>
            <input type="text" name="destination_location" placeholder="Ajaccio">
        </div>
    </div>
    <div>
        <label>Nom <span class="meta" style="font-weight:400">(facultatif — laisser vide pour utiliser départ/arrivée)</span></label>
        <input type="text" name="name" placeholder="Étape 1">
    </div>
    <div>
        <label>Date et heure de départ</label>
        <input type="datetime-local" name="start_time">
    </div>
    <div>
        <label>Horamètre au départ (h)</label>
        <input type="number" name="motor_hours_start" step="0.1" placeholder="ex : 1234.5">
    </div>
    <div>
        <label>Notes</label>
        <textarea name="notes" placeholder="Météo prévue, points de passage…"></textarea>
    </div>
    <div>
        <button type="submit" class="primary">Créer la route</button>
    </div>
</form>
{% endblock %}
