{% extends "base.html" %}
{% block title %}Nouvelle croisière — NautiBook{% endblock %}
{% block content %}

<div style="max-width:560px;margin:40px auto">
    <h2 style="margin:0 0 20px;font-size:20px">Nouvelle croisière</h2>

    <form method="POST" action="/cruises/new" class="card" style="display:grid;gap:14px">
        <div>
            <label>Nom de la croisière</label>
            <input type="text" name="name" placeholder="Ex : De Favignana à Castellamare" required>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr">
            <div>
                <label>Départ de</label>
                <input type="text" name="departure" placeholder="Port de départ">
            </div>
            <div>
                <label>Arrivée à</label>
                <input type="text" name="destination" placeholder="Port d'arrivée">
            </div>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr">
            <div>
                <label>Date de départ</label>
                <input type="date" name="start_time">
            </div>
            <div>
                <label>Date d'arrivée</label>
                <input type="date" name="end_time">
            </div>
        </div>
        <div style="display:flex;gap:10px">
            <button type="submit" class="primary">Créer la croisière</button>
            <a href="/cruises/list" style="padding:9px 16px;color:var(--muted);text-decoration:none;font-size:14px">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
