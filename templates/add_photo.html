{% extends "base.html" %}

{% block title %}Add Photo — {{ entry.timestamp.split('.')[0] }}{% endblock %}

{% block content %}
<a href="/logbook/{{ entry.id }}">← Back to Entry</a>
<h1 style="margin-top:8px">Add Photo to Trip</h1>
<h3 style="margin-top:4px">{{ entry.timestamp.split('.')[0] }}</h3>

<form method="POST" action="/logbook/{{ entry.id }}/add-photo" class="card" style="margin-top:12px;display:grid;gap:12px">
    <div>
        <label>Photo Path / URL</label>
        <input type="text" name="photo_path" required placeholder="/photos/sunset.jpg">
    </div>

    <div>
        <label>Comment</label>
        <textarea name="comment" placeholder="Beautiful sunset at the harbor..."></textarea>
    </div>

    <div>
        <label>Added By</label>
        <input type="text" name="added_by" placeholder="Your name">
    </div>

    <div>
        <button type="submit" class="primary">Add Photo</button>
    </div>
</form>

{% endblock %}
