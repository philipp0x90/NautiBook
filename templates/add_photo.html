{% extends "base.html" %}

{% block title %}Ajouter une photo — {{ line.timestamp.split('.')[0] }}{% endblock %}

{% block content %}

<div class="section-bar">
    <div class="section-bar-left"><a href="/logbook/{{ line.id }}">← Retour à la ligne</a></div>
    <div class="section-bar-title">Ajouter une photo</div>
    <div class="section-bar-right">{{ line.timestamp | datefr }}</div>
</div>

<form method="POST" action="/logbook/{{ line.id }}/add-photo" enctype="multipart/form-data"
      class="card" style="margin-top:12px;display:grid;gap:12px">
    <div>
        <label>Fichier image</label>
        <input type="file" name="photo_file" accept="image/*">
        <div class="meta" style="margin-top:4px">La photo est copiée dans le dossier IMG du logiciel.</div>
    </div>

    <div>
        <label>ou chemin / URL <span class="meta" style="font-weight:400">(si la photo est ailleurs)</span></label>
        <input type="text" name="photo_path" placeholder="https://exemple.com/coucher.jpg">
    </div>

    <div>
        <label>Commentaire</label>
        <textarea name="comment" placeholder="Coucher de soleil à l'entrée du port..."></textarea>
    </div>

    <div>
        <label>Ajoutée par</label>
        <input type="text" name="added_by" placeholder="Votre nom">
    </div>

    <div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </div>
</form>

{% endblock %}
